<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23B91C1C'/%3E%3Ctext x='50' y='50' font-family='Arial,sans-serif' font-size='70' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='central'%3EB%3C/text%3E%3C/svg%3E">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', sans-serif;
            background: #17212b;
            height: 100vh;
            overflow: hidden;
        }

        .tg-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            background: #17212b;
        }

        .tg-header {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .tg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .tg-info {
            flex: 1;
        }

        .tg-name {
            font-weight: 600;
            font-size: 15px;
            line-height: 18px;
        }

        .tg-status {
            font-size: 13px;
            opacity: 0.9;
            line-height: 16px;
        }

        .tg-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            background: #17212b;
            display: flex;
            flex-direction: column;
        }

        .tg-message {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
            max-width: 85%;
            width: fit-content;
        }

        .tg-message.incoming {
            align-self: flex-start;
        }

        .tg-message.outgoing {
            align-self: flex-end;
        }

        .tg-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.35;
            font-size: 15px;
        }

        .tg-message.incoming .tg-bubble {
            background: #2b5278;
            color: white;
            border-radius: 12px 12px 12px 2px;
        }

        .tg-message.outgoing .tg-bubble {
            background: #8774e1;
            color: white;
            border-radius: 12px 12px 2px 12px;
        }

        .tg-keyboard {
            display: grid;
            gap: 5px;
            margin-top: 6px;
            width: 100%;
        }

        .tg-keyboard.cols-1 { grid-template-columns: 1fr; }
        .tg-keyboard.cols-2 { grid-template-columns: 1fr 1fr; }
        .tg-keyboard.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

        .tg-btn {
            background: #2b5278;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-align: center;
            font-weight: 500;
        }

        .tg-btn:hover {
            background: #3d6a94;
        }

        .tg-btn:active {
            transform: scale(0.98);
        }

        .tg-btn.selected {
            background: #8774e1;
        }

        .tg-btn.primary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            font-weight: 600;
        }

        .tg-typing {
            display: flex;
            gap: 4px;
            padding: 10px 12px;
            background: #2b5278;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .tg-typing span {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .tg-typing span:nth-child(2) { animation-delay: 0.2s; }
        .tg-typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }

        .service-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: #2b5278;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            margin-bottom: 6px;
        }

        .service-checkbox:hover {
            background: #3d6a94;
        }

        .service-checkbox.selected {
            background: #3d6a94;
            border-color: #8774e1;
        }

        .checkbox-icon {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .service-checkbox.selected .checkbox-icon {
            background: #8774e1;
            border-color: #8774e1;
        }

        .service-checkbox.selected .checkbox-icon::after {
            content: '✓';
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .service-info {
            flex: 1;
        }

        .service-name {
            color: white;
            font-size: 14px;
            margin-bottom: 3px;
            line-height: 1.3;
        }

        .service-price {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .tg-container {
                max-width: 100%;
            }
        }
    </style>
</head>

                    { id: "starlight", name: "Звездное небо", price: 0, request: true },

        // Состояние
        let selectedBrand = null;
        let selectedModel = null;
        let selectedCategory = null;
        let selectedServices = new Set();
        let carClass = null;
        let specialCondition = null;

        const messagesContainer = document.getElementById('messages');

        function addMessage(text, type = 'incoming', buttons = null) {
            const messageEl = document.createElement('div');
            messageEl.className = `tg-message ${type}`;
            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'tg-bubble';
            bubbleEl.innerHTML = text;
            messageEl.appendChild(bubbleEl);

            if (buttons) {
                const keyboardEl = document.createElement('div');
                keyboardEl.className = `tg-keyboard cols-${buttons.cols || 2}`;
                buttons.items.forEach(btn => {
                    const btnEl = document.createElement('button');
                    btnEl.className = `tg-btn ${btn.primary ? 'primary' : ''} ${btn.selected ? 'selected' : ''}`;
                    btnEl.textContent = btn.text;
                    btnEl.onclick = btn.action;
                    keyboardEl.appendChild(btnEl);
                });
                messageEl.appendChild(keyboardEl);
            }

            messagesContainer.appendChild(messageEl);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const typingEl = document.createElement('div');
            typingEl.className = 'tg-typing';
            typingEl.id = 'typing';
            typingEl.innerHTML = '<span></span><span></span><span></span>';
            messagesContainer.appendChild(typingEl);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const typingEl = document.getElementById('typing');
            if (typingEl) typingEl.remove();
        }

        function clearMessages() {
            messagesContainer.innerHTML = '';
        }

        function addUserMessage(text) {
            addMessage(text, 'outgoing');
        }

        async function botReply(text, buttons = null, delay = 800) {
            showTyping();
            await new Promise(resolve => setTimeout(resolve, delay));
            hideTyping();
            addMessage(text, 'incoming', buttons);
        }

        async function start() {
            await botReply('👋 Добро пожаловать в Детейлинг Центр!\n\nРассчитаем стоимость услуг для вашего автомобиля.', null, 500);
            await botReply('🚗 Выберите марку автомобиля:', {
                cols: 2,
                items: [
                    { text: 'Toyota', action: () => selectBrand('toyota') },
                    { text: 'BMW', action: () => selectBrand('bmw') },
                    { text: 'Mercedes-Benz', action: () => selectBrand('mercedes') },
                    { text: 'Audi', action: () => selectBrand('audi') },
                    { text: 'Lexus', action: () => selectBrand('lexus') },
                    { text: 'Tesla', action: () => selectBrand('tesla') }
                ]
            }, 600);
        }

        async function selectBrand(brandId) {
            selectedBrand = brandId;
            const brand = carsData[brandId];
            clearMessages();
            addUserMessage(brand.name);
            await botReply(`Отлично! Марка: ${brand.name}\n\nВыберите модель:`, {
                cols: 1,
                items: brand.models.map(model => ({
                    text: model.name + (model.special ? ' ⭐' : ''),
                    action: () => selectModel(brandId, model.id)
                }))
            });
        }

        async function selectModel(brandId, modelId) {
            const brand = carsData[brandId];
            const model = brand.models.find(m => m.id === modelId);
            selectedModel = model;
            carClass = model.class;
            specialCondition = model.special || null;

            clearMessages();
            addUserMessage(`${brand.name} ${model.name}`);

            let info = `🚗 Автомобиль: ${brand.name} ${model.name}\n📊 Класс: ${carClass}`;
            if (specialCondition) {
                info += `\n⭐ Специальные условия: ${specialCondition}`;
            }

            await botReply(info + '\n\nВыберите категорию услуг:', {
                cols: 1,
                items: [
                    { text: '🛡️ Оклейка PPF пленкой (Versa/Mona/Spectroll)', action: () => selectCategory('ppf-standard') },
                    { text: '🛡️ Оклейка PPF Lummar Premium', action: () => selectCategory('ppf-lummar') },
                    { text: '🎨 Оклейка виниловой пленкой', action: () => selectCategory('vinyl-wrapping') },
                    { text: '✨ Полировка кузова', action: () => selectCategory('polishing') },
                    { text: '💎 Защитные покрытия', action: () => selectCategory('coatings') },
                    { text: '🪟 Услуги по стеклам', action: () => selectCategory('glass-services') },
                    { text: '🔧 Работа с кузовом', action: () => selectCategory('body-work') },
                    { text: '⚙️ Реставрация дисков', action: () => selectCategory('wheels') },
                    { text: '🪑 Работы по салону', action: () => selectCategory('interior') },
                    { text: '⚡ Дополнительное оборудование', action: () => selectCategory('additional') }
                ]
            });
        }

        async function selectCategory(categoryId) {
            selectedCategory = categoryId;
            const category = servicesData[categoryId];
            clearMessages();
            addUserMessage(category.name);
            await botReply(`${category.name}\n\nВыберите услуги (можно несколько):`, null, 600);

            const servicesList = document.createElement('div');
            servicesList.className = 'tg-message incoming';
            const servicesContainer = document.createElement('div');
            servicesContainer.style.cssText = 'width: 100%; max-width: 85%;';

            category.services.forEach(service => {
                const checkbox = document.createElement('div');
                checkbox.className = 'service-checkbox';
                checkbox.dataset.serviceId = service.id;

                let finalPrice;
                if (service.request) {
                    finalPrice = 'Цена по запросу';
                } else if (service.fixed) {
                    finalPrice = service.price.toLocaleString('ru-RU') + ' ₽';
                } else {
                    const price = service.prices[carClass];
                    finalPrice = price;
                    if (specialCondition === '+25%') {
                        finalPrice = Math.round(price * 1.25);
                    }
                    finalPrice = finalPrice.toLocaleString('ru-RU') + ' ₽';
                }

                checkbox.innerHTML = `
                    <div class="checkbox-icon"></div>
                    <div class="service-info">
                        <div class="service-name">${service.name}</div>
                        <div class="service-price">${finalPrice}</div>
                    </div>
                `;

                checkbox.onclick = () => toggleService(service.id, checkbox, service);
                servicesContainer.appendChild(checkbox);
            });

            servicesList.appendChild(servicesContainer);

            const keyboard = document.createElement('div');
            keyboard.className = 'tg-keyboard cols-1';
            keyboard.style.marginTop = '12px';

            const calculateBtn = document.createElement('button');
            calculateBtn.className = 'tg-btn primary';
            calculateBtn.textContent = '💰 Рассчитать стоимость';
            calculateBtn.onclick = calculate;
            keyboard.appendChild(calculateBtn);

            const backBtn = document.createElement('button');
            backBtn.className = 'tg-btn';
            backBtn.textContent = '← Выбрать другую категорию';
            backBtn.onclick = () => selectModel(selectedBrand, selectedModel.id);
            keyboard.appendChild(backBtn);

            servicesList.appendChild(keyboard);
            messagesContainer.appendChild(servicesList);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function toggleService(serviceId, checkbox, service) {
            if (service.request) {
                alert('Цена по запросу. Свяжитесь с менеджером для уточнения стоимости.');
                return;
            }

            if (selectedServices.has(serviceId)) {
                selectedServices.delete(serviceId);
                checkbox.classList.remove('selected');
            } else {
                selectedServices.add(serviceId);
                checkbox.classList.add('selected');
            }
        }

        async function calculate() {
            if (selectedServices.size === 0) {
                alert('Выберите хотя бы одну услугу');
                return;
            }

            clearMessages();
            addUserMessage('Рассчитать стоимость');
            await botReply('⏳ Рассчитываю стоимость...', null, 1500);

            const category = servicesData[selectedCategory];
            const brand = carsData[selectedBrand];
            let total = 0;
            let servicesText = '';

            selectedServices.forEach(serviceId => {
                const service = category.services.find(s => s.id === serviceId);
                if (service && !service.request) {
                    let price = service.fixed ? service.price : service.prices[carClass];
                    if (specialCondition === '+25%' && !service.fixed) {
                        price = Math.round(price * 1.25);
                    }
                    total += price;
                    servicesText += `• ${service.name}: ${price.toLocaleString('ru-RU')} ₽\n`;
                }
            });

            let resultText = `<b>💰 РАСЧЕТ СТОИМОСТИ</b>\n\n`;
            resultText += `<b>Автомобиль:</b> ${brand.name} ${selectedModel.name}\n`;
            resultText += `<b>Класс:</b> ${carClass}\n`;
            if (specialCondition) resultText += `<b>Условия:</b> ${specialCondition}\n`;
            resultText += `\n<b>Выбранные услуги:</b>\n\n${servicesText}`;
            resultText += `\n<b>═══════════════════</b>`;
            resultText += `\n<b>💎 ИТОГО: ${total.toLocaleString('ru-RU')} ₽</b>`;
            resultText += `\n<b>═══════════════════</b>`;
            resultText += `\n\n<i>Точная стоимость определяется после осмотра автомобиля</i>`;

            await botReply(resultText, {
                cols: 1,
                items: [
                    { text: '📧 Отправить расчёт на email', action: sendEmail },
                    { text: '📄 Скачать PDF', action: downloadPDF },
                    { text: '💬 Связаться с менеджером', action: contactManager },
                    { text: '🔄 Новый расчёт', action: restart, primary: true }
                ]
            }, 800);
        }

        async function sendEmail() {
            clearMessages();
            addUserMessage('Отправить расчёт на email');
            await botReply('📧 Введите ваш email, и мы отправим подробный расчёт.\n\nНапишите email в чате или нажмите "Новый расчёт"', {
                cols: 1,
                items: [{ text: '🔄 Новый расчёт', action: restart, primary: true }]
            });
        }

        async function downloadPDF() {
            clearMessages();
            addUserMessage('Скачать PDF');
            await botReply('📄 Генерирую PDF с расчётом...\n\nВ реальном боте здесь будет ссылка на скачивание PDF-файла с детальным расчётом.', {
                cols: 1,
                items: [{ text: '🔄 Новый расчёт', action: restart, primary: true }]
            }, 1200);
        }

        async function contactManager() {
            clearMessages();
            addUserMessage('Связаться с менеджером');
            await botReply('💬 Отлично! Наш менеджер свяжется с вами в ближайшее время.\n\n📞 Телефон: +7 (812) 123-45-67\n📧 Email: detailing@example.com\n\nЧем ещё могу помочь?', {
                cols: 1,
                items: [{ text: '🔄 Новый расчёт', action: restart, primary: true }]
            });
        }

        async function restart() {
            selectedBrand = null;
            selectedModel = null;
            selectedCategory = null;
            selectedServices = new Set();
            carClass = null;
            specialCondition = null;
            clearMessages();
            start();
        }

        start();
    </script>
</body>
</html>
